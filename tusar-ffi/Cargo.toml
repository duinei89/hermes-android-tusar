[package]
name = "tusar"
version = "0.1.0"
edition = "2021"

[lib]
name = "tusar"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

hbc-decomp = {
    git = "https://github.com/SymbioticSec/hermes-decomp.git",
    branch = "main",
    package = "hbc-decomp"
}
